name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-thread-orchestrator/mcp-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: project-thread-orchestrator/mcp-server/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build and verify package
        run: pnpm run build && pnpm run verify:dist && pnpm run validate:package
